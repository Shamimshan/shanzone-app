name: shanzone_app
description: SHAN ZONE Broadband — Customer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  http: ^1.2.1                    # Apps Script API calls + native speed test
  shared_preferences: ^2.2.3      # local session / remembered device
  image_picker: ^1.1.2            # profile photo (camera/gallery)
  url_launcher: ^6.3.0            # UPI payment intent + WhatsApp/Call
  google_fonts: ^6.2.1            # Poppins across the app
  qr_flutter: ^4.1.0              # UPI QR code in the recharge sheet
  local_auth: ^2.3.0              # fingerprint quick-login for a remembered device
  flutter_svg: ^2.0.9             # WiFi icon and other SVG assets (added for speed test)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.png"
