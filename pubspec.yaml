name: shanzone_app
description: SHAN ZONE Broadband — Customer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ── Existing dependencies ──────────────────────────────────
  http: ^1.2.1                    # Apps Script API calls + speed test
  shared_preferences: ^2.2.3      # local session / remembered device
  image_picker: ^1.1.2            # profile photo
  url_launcher: ^6.3.0            # UPI payment + WhatsApp/Call
  google_fonts: ^6.2.1            # Poppins font
  qr_flutter: ^4.1.0              # UPI QR code
  local_auth: ^2.3.0              # fingerprint login
  flutter_svg: ^2.0.9             # WiFi icon

  # ── Auto‑update dependencies (fixed versions) ──────────────
  package_info_plus: ^8.0.0       # 🔄 upgraded to resolve conflict
  permission_handler: ^11.3.0     # storage & install permissions
  open_file: ^3.3.2               # open APK with system installer
  path_provider: ^2.1.0           # external storage directory

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.png"
