name: shanzone_app
description: SHAN ZONE Broadband — Customer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ── Existing ────────────────────────────────────────────────
  http: ^1.2.1
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0
  flutter_svg: ^2.0.9

  # ── Auto‑update (fixed versions) ──────────────────────────
  package_info_plus: ^8.0.0      # ✅ conflict resolved
  permission_handler: ^11.3.0
  open_file: ^3.3.2
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.png"
