name: Build APK

# GitHub ke "Actions" tab se manually run karein ("Run workflow" button),
# ya har baar jab aap "main" branch pe push karein toh apne aap chalega.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Purana Flutter version pin nahi kar rahe — latest stable use karte
      # hain, taaki Android Gradle Plugin/AAPT2 bhi naya (SDK 35-compatible)
      # aaye, aur manual Kotlin version patch ki zaroorat na pade.
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate missing Android platform files
        run: flutter create . --platforms=android --project-name shanzone_app

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shanzone-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
