name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      # 🔥 Step 1: Regenerate Android folder (fix v1 embedding)
      - name: Regenerate Android folder
        run: |
          rm -rf android/
          flutter create . --platforms=android --project-name shanzone_app

      # 🔥 Step 2: Restore custom AndroidManifest.xml & file_paths.xml
      - name: Restore custom Android files
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
            <application
                android:label="SHAN ZONE"
                android:icon="@mipmap/ic_launcher"
                android:requestLegacyExternalStorage="true"
                tools:targetApi="29">
              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:launchMode="singleTop"
                  android:theme="@style/LaunchTheme"
                  android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                  android:hardwareAccelerated="true"
                  android:windowSoftInputMode="adjustResize">
                <meta-data
                    android:name="flutterEmbedding"
                    android:value="2" />
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                <meta-data
                    android:name="android.support.FILE_PROVIDER_PATHS"
                    android:resource="@xml/file_paths" />
              </provider>
              <meta-data
                  android:name="flutterEmbedding"
                  android:value="2" />
            </application>
          </manifest>
          EOF

          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
            <external-path name="external" path="." />
            <external-files-path name="external_files" path="." />
            <cache-path name="cache" path="." />
            <external-cache-path name="external_cache" path="." />
            <files-path name="files" path="." />
          </paths>
          EOF

      # 🔥 Step 3: Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 🔥 Step 4: Generate app icons (NEW)
      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons:main

      # 🔥 Step 5: Build APK
      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk shanzone_app_${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: shanzone_app_${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
          name: "SHAN ZONE ${{ github.ref_name }}"
          body: |
            ## 🚀 SHAN ZONE App – Version ${{ github.ref_name }}
            - APK attached below
            - Install and enjoy!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
