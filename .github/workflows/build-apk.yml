name: Build & Release APK

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v1.0.1, etc.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             shanzone_app_${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: shanzone_app_${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
          name: "SHAN ZONE ${{ github.ref_name }}"
          body: |
            ## 🚀 SHAN ZONE App – Version ${{ github.ref_name }}

            ### What's New
            - Auto-generated release from GitHub Actions
            - Download the APK below and install it.

            ### Installation
            1. Download the APK from the assets below
            2. Open the file on your Android device
            3. Tap "Install" (allow "Install from unknown sources" if prompted)

            ### Changelog
            See commit history for full changes.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
