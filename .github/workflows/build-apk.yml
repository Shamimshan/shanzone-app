name: Build APK

# GitHub ke "Actions" tab se manually run karein ("Run workflow" button),
# ya har baar jab aap "main" branch pe push karein toh apne aap chalega.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate missing Android platform files
        run: flutter create . --platforms=android

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shanzone-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
