name: Build APK

# GitHub ke "Actions" tab se manually run karein ("Run workflow" button),
# ya har baar jab aap "main" branch pe push karein toh apne aap chalega.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate missing Android platform files
        run: flutter create . --platforms=android --project-name shanzone_app

      - name: Add permissions + queries (Internet, Biometric, https/tel/upi launch, WhatsApp visibility)
        run: |
          cat > /tmp/manifest_insert.xml << 'MANIFESTEOF'
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                      <data android:scheme="tel" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="upi" />
                  </intent>
                  <package android:name="com.whatsapp" />
              </queries>
          MANIFESTEOF
          sed -i '/<manifest /r /tmp/manifest_insert.xml' android/app/src/main/AndroidManifest.xml

      - name: Set app display name to "SHAN ZONE"
        run: |
          sed -i 's/android:label="[^"]*"/android:label="SHAN ZONE"/' android/app/src/main/AndroidManifest.xml

      - name: Enable fingerprint support (MainActivity must extend FlutterFragmentActivity)
        run: |
          MAINACTIVITY=$(find android -name "MainActivity.kt")
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$MAINACTIVITY"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate custom app launcher icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shanzone-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
